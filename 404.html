<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Goodstuff Studio</title>
    <!--
      Every other page uses relative paths, so it does not matter what the site
      is served from. This one is different: GitHub Pages serves 404.html for
      ANY missing path at ANY depth, so relative URLs would resolve against
      whatever the visitor typed. These must be absolute.

      The prefix below assumes a GitHub Pages project site at
      goodstuffstudio.github.io/goodstuffstudio/. If you attach a custom domain
      (which serves from the root), change the four /goodstuffstudio/ prefixes
      in this file to /.
    -->
    <link rel="stylesheet" href="/goodstuffstudio/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="wordmark" href="/goodstuffstudio/">Goodstuff&nbsp;Studio</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/goodstuffstudio/support/">Support</a>
          <a href="/goodstuffstudio/privacy/">Privacy</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap">
        <h1>Page not found</h1>
        <p class="lede">
          That link does not lead anywhere. It may have moved, or never existed.
        </p>
        <ul class="card-list">
          <li>
            <a class="card" href="/goodstuffstudio/support/">
              <strong>Support</strong>
              <span>Get help with a Goodstuff Studio app</span>
            </a>
          </li>
          <li>
            <a class="card" href="/goodstuffstudio/privacy/">
              <strong>Privacy</strong>
              <span>How we handle your data</span>
            </a>
          </li>
        </ul>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>&copy; 2026 Goodstuff Studio</span>
      </div>
    </footer>
  </body>
</html>
