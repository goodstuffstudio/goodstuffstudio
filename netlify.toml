# Static site — no build step. Netlify publishes the repo root as-is and
# serves 404.html for unmatched paths automatically.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The pages load nothing but their own stylesheet: no scripts, no fonts,
    # no images, no third-party anything. Keep this in sync if that changes.
    Content-Security-Policy = "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
